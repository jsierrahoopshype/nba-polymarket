name: poll

# Polls Polymarket every 10 minutes, sweeps any markets that dropped off the
# active feed without resolving, rebuilds the index, and commits any changed
# data back to the repository. Also runnable on demand from the Actions tab
# (workflow_dispatch).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Allow the job to push commits back to the branch.
permissions:
  contents: write

# Never let two poll runs overlap, and never cancel one that is mid-commit.
concurrency:
  group: poll-polymarket
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Poll Polymarket (one automatic retry on failure)
        run: |
          python scripts/poll_polymarket.py || {
            echo "Poller failed once; retrying in 10s..."
            sleep 10
            python scripts/poll_polymarket.py
          }

      - name: Build index
        run: python scripts/build_index.py

      - name: Commit and push data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: poll $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
