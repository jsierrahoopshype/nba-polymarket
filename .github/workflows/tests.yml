name: tests

# Runs the unit tests on every push and pull request. Kept separate from the
# poll job on purpose: a failing test never blocks the 10-minute data poll.
# (Poll commits are pushed with GITHUB_TOKEN, which does not trigger workflows,
# so this runs on human pushes/merges and PRs, not every poll.)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v
