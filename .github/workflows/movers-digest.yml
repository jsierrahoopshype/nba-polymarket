name: movers-digest

# Posts the Slack movers digest three times a day at 07:00 / 15:00 / 23:00
# Europe/Madrid. GitHub cron is in UTC and Madrid shifts with DST, so each target
# fires at the two UTC hours that bracket it (CET = UTC+1, CEST = UTC+2);
# movers_alerts.py gates on the Madrid local hour and a once-per-slot guard
# (digest3.slots), so exactly one digest goes out per window regardless of DST,
# even if a cron fires late.
#   07:00 Madrid -> 05:00/06:00 UTC
#   15:00 Madrid -> 13:00/14:00 UTC
#   23:00 Madrid -> 21:00/22:00 UTC

on:
  schedule:
    - cron: "0 5,6 * * *"     # 07:00 Europe/Madrid
    - cron: "0 13,14 * * *"   # 15:00 Europe/Madrid
    - cron: "0 21,22 * * *"   # 23:00 Europe/Madrid
  workflow_dispatch:

permissions:
  contents: write

# Share the poller's concurrency group so the digest and a poll never push at the
# same time (both commit data/alerts_state.json).
concurrency:
  group: poll-polymarket
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post movers digest
        env:
          SLACK_MOVERS_WEBHOOK: ${{ secrets.SLACK_MOVERS_WEBHOOK }}
        # Two independent force triggers on manual dispatch (belt-and-suspenders):
        #   1. This ternary appends --force on workflow_dispatch (nothing on cron).
        #   2. The script also forces when GITHUB_EVENT_NAME == workflow_dispatch,
        #      which GitHub sets automatically — so a manual run forces even if the
        #      ternary above ever resolved to empty.
        run: python scripts/movers_alerts.py --digest ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} || echo "digest step failed (non-fatal)"

      - name: Commit alerts state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts_state.json
          if git diff --staged --quiet; then
            echo "No alerts-state change to commit."
          else
            git commit -m "alerts: digest state $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main && git push
          fi
