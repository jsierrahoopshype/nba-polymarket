name: validate

# Smoke test / API-shape check. Run manually from the Actions tab. It runs the
# exploration script against the live Polymarket APIs and commits the resulting
# scripts/validation_report.json back to the branch, so you can inspect exactly
# what the API returned from a real CI runner. Re-run this any time Polymarket
# might have changed their API shape.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run validation against live Polymarket APIs
        run: python scripts/validate_polymarket.py

      - name: Commit and push the validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation_report.json
          if git diff --staged --quiet; then
            echo "No change in validation report."
          else
            git commit -m "validate: report $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
