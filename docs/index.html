<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Polymarket Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

  <div class="tabs">
    <a href="index.html" class="active">Standings</a>
    <a href="movers.html">Movers</a>
    <a href="resolved.html">Resolved</a>
    <a href="players/">Players</a>
    <a href="teams/">Teams</a>
  </div>

  <div class="hdr">
    <h1>NBA Polymarket</h1>
    <span class="brand">HoopsHype</span>
  </div>
  <div class="subtitle">
    Live implied odds for the championship, Finals MVP, the draft and individual
    games — straight from Polymarket, refreshed every poll.
    <span class="stamp" id="stamp"></span>
  </div>

  <div class="gsearch-wrap"><input class="gsearch" type="text" placeholder="Search markets, players, teams…" autocomplete="off" aria-label="Search"><div class="gsearch-results"></div></div>

  <div id="app"><div class="loading">Loading market data…</div></div>

  <div class="gsearch-wrap"><input class="gsearch" type="text" placeholder="Search markets, players, teams…" autocomplete="off" aria-label="Search"><div class="gsearch-results"></div></div>
  <div class="foot" id="foot"></div>
</div>

<script src="app.js"></script>
<script>
const COLLAPSE = 12;            // rows shown per standings group before "View all"
const MOVERS_TOP = 10;          // movers shown on the landing page

let ALL_LIVE = [];              // live markets with a usable price
let NORM = null;               // conditionId -> normalized probability
let SHOW_LOWVOL = false;        // reveal sub-$10K / placeholder markets

/* ---------- row / card builders ---------- */
function moverRow(m, i) {
  const d = fmtDelta(m.delta24h);
  return '<tr data-id="' + esc(m.conditionId) + '">' +
    '<td class="rank">' + i + '</td>' +
    '<td class="name"><span class="q">' + settledBadge(m) + esc(displayTitle(m)) + '</span>' +
      '<span class="ev">' + esc(m.eventTitle || '') + '</span>' + entityChips(m.conditionId) + '</td>' +
    '<td><span class="cat">' + esc(categoryOf(m).label) + '</span></td>' +
    '<td class="spark">' + sparkline(m.sparkline) + '</td>' +
    '<td class="pct">' + probHtml(m, NORM) + '</td>' +
    '<td><span class="delta ' + d.cls + '">' + d.text + '</span></td>' +
  '</tr>';
}

function standRow(m, extra) {
  const d24 = fmtDelta(m.delta24h), d7 = fmtDelta(m.delta7d);
  return '<tr data-id="' + esc(m.conditionId) + '"' + (extra ? ' hidden data-extra' : '') + '>' +
    '<td class="name">' + entityThumb(m.conditionId) +
      '<span class="q">' + settledBadge(m) + esc(displayTitle(m)) + '</span>' +
      entityChips(m.conditionId) + '</td>' +
    '<td class="vol">' + fmtVol(m.volume) + '</td>' +
    '<td class="spark">' + sparkline(m.sparkline) + '</td>' +
    '<td class="pct">' + probHtml(m, NORM) + '</td>' +
    '<td><span class="delta ' + d24.cls + '">' + d24.text + '</span></td>' +
    '<td><span class="delta ' + d7.cls + '">' + d7.text + '</span></td>' +
  '</tr>';
}

function card(m, opts) {
  opts = opts || {};
  const d24 = fmtDelta(m.delta24h), d7 = fmtDelta(m.delta7d);
  const sub = (opts.showCat ? esc(categoryOf(m).label) + ' · ' : '') + esc(m.eventTitle || '');
  let foot = '<span class="lbl">Vol</span><span>' + fmtVol(m.volume) + '</span>' +
    '<span class="lbl">24h</span><span class="delta ' + d24.cls + '">' + d24.text + '</span>';
  if (opts.show7d) foot += '<span class="lbl">7d</span><span class="delta ' + d7.cls + '">' + d7.text + '</span>';
  foot += m.sparkline && m.sparkline.length >= 2 ? sparkline(m.sparkline) : '';
  return '<div class="card" data-id="' + esc(m.conditionId) + '"' + (opts.extra ? ' hidden data-extra' : '') + '>' +
    '<div class="now"><span class="p">' + probHtml(m, NORM) + '</span></div>' +
    '<div class="q">' + entityThumb(m.conditionId) + settledBadge(m) + esc(displayTitle(m)) + '</div>' +
    '<div class="ev">' + sub + '</div>' + entityChips(m.conditionId) +
    '<div class="card-foot">' + foot + '</div>' +
  '</div>';
}

/* ---------- sections ---------- */
function moversSection(visible) {
  const movers = visible
    .filter(m => isNum(m.delta24h))
    .sort((a, b) => Math.abs(b.delta24h) - Math.abs(a.delta24h))
    .slice(0, MOVERS_TOP);
  if (!movers.length) return '';

  const rows = movers.map((m, i) => moverRow(m, i + 1)).join('');
  const cards = movers.map(m => card(m, { showCat: true })).join('');
  return '<div class="block" id="movers">' +
    '<div class="block-head"><h2>Biggest movers · last 24h</h2>' +
      '<a class="more" href="movers.html">See all movers →</a></div>' +
    '<div class="table-wrap"><table class="lb"><thead><tr>' +
      '<th class="rank"></th><th class="left">Market</th><th>Category</th>' +
      '<th>Trend</th><th>Now</th><th>24h</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="cards">' + cards + '</div>' +
  '</div>';
}

function standingsSection(visible) {
  // bucket by category, highest volume first within each group
  const byCat = new Map(CATEGORIES.map(c => [c.key, []]));
  visible.forEach(m => byCat.get(categoryOf(m).key).push(m));
  byCat.forEach(list => list.sort((a, b) => (b.volume || 0) - (a.volume || 0)));

  const present = CATEGORIES.filter(c => byCat.get(c.key).length);

  const chips = '<button class="chip active" data-cat="all">All' +
      '<span class="ct">' + visible.length + '</span></button>' +
    present.map(c => '<button class="chip" data-cat="' + c.key + '">' +
      esc(c.label) + '<span class="ct">' + byCat.get(c.key).length + '</span></button>').join('');

  const groups = present.map(c => {
    const list = byCat.get(c.key);
    const rows = list.map((m, i) => standRow(m, i >= COLLAPSE)).join('');
    const cards = list.map((m, i) => card(m, { show7d: true, extra: i >= COLLAPSE })).join('');
    const eventUrl = polyEventUrl(list[0] && list[0].eventSlug);
    const more = list.length > COLLAPSE
      ? '<button class="showmore" data-group="' + c.key + '">View all ' + list.length + ' →</button>'
      : '';
    return '<div class="group" data-cat="' + c.key + '">' +
      '<div class="group-head"><h3>' + esc(c.label) + '</h3>' +
        '<span class="ct">' + list.length + '</span></div>' +
      '<div class="table-wrap"><table class="lb"><thead><tr>' +
        '<th class="left">Market</th><th>Vol</th><th>Trend</th><th>Now</th><th>24h</th><th>7d</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="cards">' + cards + '</div>' + more +
    '</div>';
  }).join('');

  return '<div class="block" id="standings">' +
    '<div class="block-head"><h2>Standings</h2>' +
      '<span class="sub">' + visible.length + ' markets' +
        (NORM && NORM.size ? ' · multi-outcome odds normalized to 100%' : '') + '</span></div>' +
    '<div class="filters"><div class="chips" id="chips">' + chips + '</div></div>' +
    '<div id="groups">' + groups + '</div>' +
  '</div>';
}

function controlBar() {
  const hidden = ALL_LIVE.length - ALL_LIVE.filter(passesFloor).length;
  return '<div class="lowvol-bar">' +
    '<button class="lowvol-toggle' + (SHOW_LOWVOL ? ' active' : '') + '" id="lowvol">' +
      (SHOW_LOWVOL ? 'Hide low-volume markets' : 'Show low-volume markets') +
    '</button>' +
    '<span class="lowvol-note">' +
      (SHOW_LOWVOL
        ? 'Showing all markets, including under $' + (MIN_VOLUME / 1000) + 'K and placeholders.'
        : hidden + ' market' + (hidden === 1 ? '' : 's') + ' under $' + (MIN_VOLUME / 1000) + 'K hidden.') +
    '</span></div>';
}

/* ---------- interactions ---------- */
function renderApp() {
  const visible = SHOW_LOWVOL ? ALL_LIVE : ALL_LIVE.filter(passesFloor);
  const app = document.getElementById('app');
  if (!visible.length) {
    app.innerHTML = controlBar() + '<div class="empty">No markets to show.</div>';
    wireLowVol();
    return;
  }
  app.innerHTML = controlBar() + moversSection(visible) + standingsSection(visible);
  wireRowNav(app);
  wireChips();
  wireExpanders();
  wireLowVol();
}

function wireLowVol() {
  const btn = document.getElementById('lowvol');
  if (btn) btn.addEventListener('click', () => { SHOW_LOWVOL = !SHOW_LOWVOL; renderApp(); });
}

function wireChips() {
  const chips = document.getElementById('chips');
  if (!chips) return;
  chips.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    chips.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));
    const cat = btn.dataset.cat;
    document.querySelectorAll('#groups .group').forEach(g => {
      g.hidden = !(cat === 'all' || g.dataset.cat === cat);
    });
  });
}

function wireExpanders() {
  document.querySelectorAll('.showmore[data-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.closest('.group');
      const shown = btn.dataset.open === '1';
      group.querySelectorAll('[data-extra]').forEach(el => { el.hidden = shown; });
      btn.dataset.open = shown ? '0' : '1';
      const n = group.querySelector('.group-head .ct').textContent;
      btn.textContent = shown ? ('View all ' + n + ' →') : 'Show fewer ↑';
    });
  });
}

/* ---------- boot ---------- */
(async function () {
  const app = document.getElementById('app');
  try {
    const data = await loadData('index.json');
    document.getElementById('stamp').textContent =
      data.lastUpdated ? 'Updated ' + fmtStamp(data.lastUpdated) : '';

    await loadEntities();              // headshots/logos for standings rows (optional)
    registerSlugs(data.markets);       // route market links to /market/<slug>/
    NORM = computeNormalized(data.markets);
    ALL_LIVE = (data.markets || []).filter(m => !m.resolved && isNum(m.impliedProbability));

    if (!ALL_LIVE.length) { app.innerHTML = '<div class="empty">No live markets right now.</div>'; return; }

    renderApp();

    document.getElementById('foot').innerHTML =
      'Data from Polymarket · ' + (data.count || data.markets.length) +
      ' markets tracked · odds are implied probabilities, not guarantees.';
  } catch (err) {
    app.innerHTML = '<div class="empty">Couldn’t load market data.<br>' +
      '<span style="font-size:.8rem">' + esc(String(err && err.message || err)) + '</span></div>';
  }
})();
</script>
<script src="search.js"></script>
</body>
</html>
